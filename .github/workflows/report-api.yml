name: report-api

on: [push, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/report-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: pytest -v

  build:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t report-api:${{ github.sha }} services/report-api